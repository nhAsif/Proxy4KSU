name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
          cache-dependency-path: XrayHelper/go.sum

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Build XrayHelper binaries
        shell: bash
        working-directory: XrayHelper
        env:
          CGO_ENABLED: 1
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          go mod download

          export GOOS=android

          export GOARCH=arm64
          export CC="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export CXX="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++"
          go build -v -trimpath -ldflags "-s -w -buildid=" -o ../xray/bin/arm64/xrayhelper ./main

          export GOARCH=amd64
          export CC="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang"
          export CXX="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang++"
          go build -v -trimpath -ldflags "-s -w -buildid=" -o ../xray/bin/x64/xrayhelper ./main

      - name: Copy Files
        run: |
          mkdir -p build_assets
          cp -r ${GITHUB_WORKSPACE}/META-INF/ ./build_assets/
          cp -r ${GITHUB_WORKSPACE}/webroot/ ./build_assets/
          cp -r ${GITHUB_WORKSPACE}/xray/ ./build_assets/
          cp ${GITHUB_WORKSPACE}/proxy4ksu_service.sh ./build_assets/
          cp ${GITHUB_WORKSPACE}/customize.sh ./build_assets/
          cp ${GITHUB_WORKSPACE}/module.prop ./build_assets/
          cp ${GITHUB_WORKSPACE}/uninstall.sh ./build_assets/
          cp ${GITHUB_WORKSPACE}/update.json ./build_assets/
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/
          cp ${GITHUB_WORKSPACE}/README_zh_CN.md ./build_assets/

      - name: Read module version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip=Proxy4KSU-${VERSION#v}.zip" >> "$GITHUB_OUTPUT"

      - name: Create ZIP archive
        shell: bash
        run: |
          ZIP="${{ steps.version.outputs.zip }}"
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr "../${ZIP}" .
          popd || exit 1
          FILE="./${ZIP}"
          DGST="$FILE.dgst"
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD "$FILE" | sed 's/([^)]*)//g' >>"$DGST"
          done

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Proxy4KSU
          path: |
            ./${{ steps.version.outputs.zip }}
            ./${{ steps.version.outputs.zip }}.dgst

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: changelog.md
          fail_on_unmatched_files: true
          files: |
            ${{ steps.version.outputs.zip }}
            ${{ steps.version.outputs.zip }}.dgst
